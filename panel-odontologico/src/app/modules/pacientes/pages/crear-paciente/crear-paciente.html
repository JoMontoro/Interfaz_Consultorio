<div class="form-container">
  <h2>Registrar Paciente</h2>

  <input [(ngModel)]="paciente.nombre" placeholder="Nombre">
  <input [(ngModel)]="paciente.apellido" placeholder="Apellido">
  <input [(ngModel)]="paciente.edad" type="number" placeholder="Edad">
  <input [(ngModel)]="paciente.apoderado" placeholder="Apoderado">
  <input [(ngModel)]="paciente.direccion" placeholder="Dirección">
  <input   
  id="dni"
  type="text"
  [(ngModel)]="paciente.dni"
  name="dni"
  maxlength="8"
  (input)="soloNumeros($event)"
  required
 placeholder="DNI">
  <input   
  id="telefono"
  type="text"
  [(ngModel)]="paciente.telefono"
  name="telefono"
  maxlength="9"
  pattern="9[0-9]{8}"
  required placeholder="Teléfono">
  <input [(ngModel)]="paciente.email" placeholder="Email">

  <button (click)="guardar()">Guardar</button>
  <button (click)="cancelar()" class="btn-cancelar">Cancelar</button>
</div>
