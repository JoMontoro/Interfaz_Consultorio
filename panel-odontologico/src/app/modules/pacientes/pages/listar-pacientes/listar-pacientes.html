<div class="container">
  <h2>Lista de Pacientes</h2>

  <button class="btn-agregar" routerLink="/pacientes/crear">
    + Nuevo Paciente
  </button>

  <table>
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>Edad</th>
        <th>Apoderado</th>
        <th>Dirección</th>
        <th>DNI</th>
        <th>Teléfono</th>
        <th>Email</th>
        <th>Acciones</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let p of Lista" class="patient-row">
        <td>{{p.nombre}}</td>
        <td>{{p.apellido}}</td>
        <td>{{p.edad}}</td>
        <td>{{p.apoderado}}</td>
        <td>{{p.direccion}}</td>
        <td>{{p.dni}}</td>
        <td>{{p.telefono}}</td>
        <td>{{p.email}}</td>
        <td class="td-actions">
          <button class="btn-editar" [routerLink]="['/pacientes/editar', p.id_paciente]">
            ✏️ Editar
          </button>
          <button class="btn-ver" [routerLink]="[
              '/pacientes/detalle',
              p.id_paciente,
            ]">
            Ver Detalle
          </button>
          <button class="btn-eliminar" (click)="eliminar(p.id_paciente)">
            🗑️ Eliminar
          </button>
        </td>
      </tr>
    </tbody>  
  </table>
  <div class="pagination">

  <button
    (click)="paginaAnterior()"
    [disabled]="pagina === 0"
  >
    Anterior
  </button>

  <span>

    Página
    {{ pagina + 1 }}
    de
    {{ totalPages }}

  </span>

  <button
    (click)="siguientePagina()"
    [disabled]="pagina >= totalPages - 1"
  >
    Siguiente
  </button>

</div>
</div>
