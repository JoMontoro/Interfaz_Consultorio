<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">🦷</div>
      <div>
        <h1>Consultorio Odontológico</h1>
        <p>Acceso seguro al panel administrativo</p>
      </div>
    </div>

    <div class="login-form">
      <label>Usuario</label>
      <input [(ngModel)]="username" placeholder="Ingrese su usuario">

      <label>Contraseña</label>
      <input [(ngModel)]="password" type="password" placeholder="Ingrese su contraseña">

      <button (click)="login()">Ingresar</button>
    </div>

    <div class="login-footer">
      <p>Bienvenido al consultorio dental. Usa tus credenciales para iniciar sesión.</p>
    </div>
  </div>
</div>
