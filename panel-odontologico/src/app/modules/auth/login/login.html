<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
          <path d="M7 12l5 3 5-3"/>
        </svg>
      </div>
      <div>
        <h1>Consultorio Odontológico</h1>
        <p>Acceso seguro al panel de gestión</p>
      </div>
    </div>

    <div class="login-form">
      <div class="input-group">
        <label for="username">Usuario</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <input id="username" [(ngModel)]="username" placeholder="Ingrese su usuario" (keyup.enter)="login()" autocomplete="username">
        </div>
      </div>

      <div class="input-group">
        <label for="password">Contraseña</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input id="password" [(ngModel)]="password" type="password" placeholder="Ingrese su contraseña" (keyup.enter)="login()" autocomplete="current-password">
        </div>
      </div>

      <div *ngIf="errorMsg" class="error-msg">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        {{ errorMsg }}
      </div>

      <button class="btn-ingresar" (click)="login()" [disabled]="loading">
        <div *ngIf="loading" class="btn-spinner"></div>
        <span *ngIf="!loading">Ingresar</span>
        <span *ngIf="loading">Ingresando...</span>
      </button>
    </div>

    <div class="login-footer">
      <svg class="footer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
        <path d="M2 17l10 5 10-5"/>
        <path d="M2 12l10 5 10-5"/>
      </svg>
      <p>Sistema de Gestión Odontológica. Use sus credenciales autorizadas para acceder.</p>
    </div>
  </div>
</div>
