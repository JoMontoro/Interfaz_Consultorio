<div class="app-shell">
  <aside class="sidebar" *ngIf="showSidebar">
    <div class="sidebar-brand">
      <h1>Consultorio</h1>
      <p>Panel Odontológico</p>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/panel-principal" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Panel Principal</a>
    </nav>
        <nav class="sidebar-nav">
      <a routerLink="/pacientes" routerLinkActive="" [routerLinkActiveOptions]="{ exact: true }">Lista de Pacientes</a>
    </nav>
        
    <button class="sidebar-logout" (click)="logout()">Cerrar sesión</button>
  </aside>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
